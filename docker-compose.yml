services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mesaviva}
      POSTGRES_USER: ${POSTGRES_USER:-mesaviva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesaviva}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mesaviva}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mesaviva}:${POSTGRES_PASSWORD:-mesaviva}@postgres:5432/${POSTGRES_DB:-mesaviva}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-mesaviva123}
      WAITER_USERNAME: ${WAITER_USERNAME:-garcom}
      WAITER_PASSWORD: ${WAITER_PASSWORD:-garcom123}
      KITCHEN_USERNAME: ${KITCHEN_USERNAME:-cozinha}
      KITCHEN_PASSWORD: ${KITCHEN_PASSWORD:-cozinha123}
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - backend

volumes:
  postgres_data:
