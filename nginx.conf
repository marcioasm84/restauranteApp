server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: any path that isn't a real file falls back to
  # index.html so client-side routing (react-router) can handle it.
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Proxy API + WebSocket to the backend container, so the whole app is
  # reachable through this single port/origin — no matter how that origin
  # is reached (LAN IP, localhost, an ngrok tunnel, ...). The frontend build
  # is configured (see Dockerfile) to call these as same-origin paths.
  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
  }

  location /ws {
    proxy_pass http://backend:4000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
}
