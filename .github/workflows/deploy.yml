name: Deploy

# Publica a aplicação na instância que já existe (provisionada manualmente
# via `cdk deploy` em infra/ — ver AWS_DEPLOYMENT.md). Opcional: sem este
# workflow, o mesmo resultado sai rodando `infra/scripts/deploy.sh` via SSH
# manualmente. Ajuste a branch abaixo para a que você trata como produção.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.INSTANCE_HOST }}
          # Usuário padrão do blueprint Amazon Linux 2023 no Lightsail —
          # confirme no console (aba "Connect") no primeiro acesso.
          username: ec2-user
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: bash /opt/app/infra/scripts/deploy.sh
